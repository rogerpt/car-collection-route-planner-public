<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Collection Route Planner</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f5f5}
#msg{padding:40px;text-align:center;color:#333}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #ddd;border-top-color:#007bff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
iframe{border:0;position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="msg"><p class="spinner"></p><p>Loading route planner…</p></div>
<script>
(async function(){
  var N = 9;
  try {
    var parts = [];
    for (var i = 0; i < N; i++) {
      var t = await fetch('c' + i + '.b64?v=2').then(function(r){
        if (!r.ok) throw new Error('chunk ' + i + ' missing');
        return r.text();
      });
      parts.push(t.trim());
    }
    var bin = atob(parts.join(''));
    var html = bin;
    try { html = decodeURIComponent(escape(bin)); } catch (e) {}
    var iframe = document.createElement('iframe');
    iframe.title = 'Car Collection Route Planner';
    document.body.innerHTML = '';
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
  } catch (e) {
    document.getElementById('msg').innerHTML =
      '<p>Could not load app.</p>' +
      '<p><a href="https://raw.githack.com/rogerpt/car-collection-route-planner-public/a39226b2c733d25ace36dc794c328760a82b962a/index.html">Open previous version</a></p>' +
      '<pre>' + e + '</pre>';
  }
})();
</script>
</body>
</html>
