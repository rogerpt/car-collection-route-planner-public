<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Collection Route Planner</title>
<style>
body{font-family:Arial,sans-serif;margin:40px;text-align:center;color:#333}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #ddd;border-top-color:#007bff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<p class="spinner"></p>
<p>Loading route planner…</p>
<script>
(async function(){
  const SRC = 'https://cdn.jsdelivr.net/gh/rogerpt/car-collection-route-planner-public@a39226b2c733d25ace36dc794c328760a82b962a/index.html';
  try {
    const res = await fetch(SRC);
    if (!res.ok) throw new Error('Failed to load app (' + res.status + ')');
    let html = await res.text();

    html = html.replace('</style>', `
        .car-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .order-btn { background: #6c757d; padding: 5px 10px; font-size: 14px; line-height: 1; min-width: 36px; }
        .order-btn:hover { background: #5a6268; }
        .order-btn:disabled { background: #bbb; cursor: not-allowed; opacity: 0.5; }
        .car-info { flex: 1; min-width: 0; }
        .car-num { color: var(--text-muted); font-size: 13px; margin-right: 6px; }
    </style>`);

    html = html.replace(
      '<div id="errorBox" class="error-box"></div>',
      '<p class="note" id="reorderHint" style="display:none">Use ↑ ↓ to change collection order. Tick “Use my list order” to keep this order when calculating.</p>' +
      '<div class="checkbox-row" id="manualOrderRow" style="display:none;margin-top:10px">' +
      '<input type="checkbox" id="useManualOrder">' +
      '<label for="useManualOrder">Use my list order (don’t auto-optimise)</label></div>' +
      '<div id="errorBox" class="error-box"></div>'
    );

    const patch = "\n<script>\n(function(){\n  function ready(fn){\n    if (typeof cars !== \"undefined\" && typeof calculateRoute === \"function\" && typeof chooseSecondPool === \"function\") fn();\n    else setTimeout(function(){ ready(fn); }, 25);\n  }\n  ready(function(){\n    window.moveCarUp = function(i){ if (i <= 0) return; var t = cars[i-1]; cars[i-1] = cars[i]; cars[i] = t; renderCarList(); };\n    window.moveCarDown = function(i){ if (i >= cars.length - 1) return; var t = cars[i+1]; cars[i+1] = cars[i]; cars[i] = t; renderCarList(); };\n    window.renderCarList = function(){\n      var container = document.getElementById(\"carList\");\n      var count = document.getElementById(\"carCount\");\n      if (count) count.textContent = cars.length;\n      var hint = document.getElementById(\"reorderHint\");\n      var row = document.getElementById(\"manualOrderRow\");\n      var show = cars.length > 1;\n      if (hint) hint.style.display = show ? \"block\" : \"none\";\n      if (row) row.style.display = show ? \"flex\" : \"none\";\n      if (cars.length === 0) { container.innerHTML = '<p style=\"color:var(--text-muted)\">No cars added yet</p>'; return; }\n      container.innerHTML = cars.map(function(car, index){\n        return '<div class=\"car-item\"><div class=\"car-info\"><span class=\"car-num\">' + (index+1) +\n          '.</span> <strong>' + car.driver + '</strong> — ' + car.reg + ' — ' + car.postcode +\n          '</div><div class=\"car-actions\">' +\n          '<button class=\"order-btn\" onclick=\"moveCarUp(' + index + ')\" ' + (index===0?'disabled':'') + ' title=\"Move up\">↑</button>' +\n          '<button class=\"order-btn\" onclick=\"moveCarDown(' + index + ')\" ' + (index===cars.length-1?'disabled':'') + ' title=\"Move down\">↓</button>' +\n          '<button class=\"delete-btn\" onclick=\"deleteCar(' + index + ')\">Remove</button></div></div>';\n      }).join('');\n    };\n    window.balanceRemainingCars = function(remaining, pool, endLoc){\n      if (remaining.length === 0) return [[], []];\n      if (remaining.length === 1) return [[remaining[0]], []];\n      var sorted = remaining.slice().sort(function(a,b){\n        return haversineMiles(pool.lat,pool.lng,b.lat,b.lng) - haversineMiles(pool.lat,pool.lng,a.lat,a.lng);\n      });\n      var group1 = [], group2 = [];\n      function straightDist(pts){\n        var d = 0;\n        for (var i = 0; i < pts.length - 1; i++) d += haversineMiles(pts[i].lat, pts[i].lng, pts[i+1].lat, pts[i+1].lng);\n        return d;\n      }\n      sorted.forEach(function(car){\n        var cur1 = group1.length === 0 ? 0 : straightDist(nearestNeighbourRoute([pool].concat(group1, [endLoc])));\n        var cur2 = group2.length === 0 ? 0 : straightDist(nearestNeighbourRoute([pool].concat(group2, [endLoc])));\n        if (cur1 <= cur2) group1.push(car); else group2.push(car);\n      });\n      if (group1.length === 0 && group2.length > 0) group1.push(group2.pop());\n      else if (group2.length === 0 && group1.length > 0) group2.push(group1.pop());\n      if (group1.length + group2.length !== remaining.length) {\n        var have = {};\n        group1.concat(group2).forEach(function(c){ have[c.reg + '|' + c.postcode + '|' + c.lat] = 1; });\n        remaining.forEach(function(c){\n          var k = c.reg + '|' + c.postcode + '|' + c.lat;\n          if (!have[k]) { if (group1.length <= group2.length) group1.push(c); else group2.push(c); }\n        });\n      }\n      return [group1, group2];\n    };\n    function cleanReg(r){ return r ? String(r).replace(/##\\d+$/, '') : r; }\n    function cleanRoute(route){ if (!route) return; route.forEach(function(l){ if (l.reg) l.reg = cleanReg(l.reg); }); }\n    var _rs = window.renderSplitRoutes;\n    window.renderSplitRoutes = function(r1, r2, a, b, sp, ik){\n      cleanRoute(r1); cleanRoute(r2);\n      if (sp && sp.reg) sp.reg = cleanReg(sp.reg);\n      return _rs.apply(this, arguments);\n    };\n    var _calc = window.calculateRoute;\n    window.calculateRoute = async function(doSplit){\n      var manualEl = document.getElementById('useManualOrder');\n      var origNN = window.nearestNeighbourRoute;\n      if (!doSplit) {\n        if (manualEl && manualEl.checked) window.nearestNeighbourRoute = function(locations){ return locations; };\n        try { return await _calc.call(this, false); }\n        finally { window.nearestNeighbourRoute = origNN; }\n      } else {\n        cars.forEach(function(c, i){ c._savedReg = c.reg; c.reg = String(c.reg) + '##' + i; });\n        try { return await _calc.call(this, true); }\n        finally { cars.forEach(function(c){ if (c._savedReg != null) { c.reg = c._savedReg; delete c._savedReg; } }); }\n      }\n    };\n    renderCarList();\n  });\n})();\n</scr" + "ipt>";

    // Fix accidental string split of script closing tag
    patch = patch.replace('</scr" + "ipt>', '</' + 'script>');

    html = html.replace('</body>', patch + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p>Could not load app.</p><p><a href="' + SRC + '">Open previous version</a></p><pre>' + e + '</pre>';
  }
})();
</script>
</body>
</html>
