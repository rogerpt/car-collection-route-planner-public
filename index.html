<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Collection Route Planner</title>
<style>body{margin:0;font-family:Arial,sans-serif}#boot{padding:40px;text-align:center;color:#333}.spinner{display:inline-block;width:32px;height:32px;border:3px solid #ddd;border-top-color:#007bff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<div id="boot"><p class="spinner"></p><p>Loading…</p></div>
<script>
(async function(){
  try {
    var parts = await Promise.all([0,1,2].map(function(i){
      return fetch('app.part' + i + '.txt?v=3').then(function(r){
        if (!r.ok) throw new Error('Missing part ' + i);
        return r.text();
      });
    }));
    var html = parts.join('');
    var iframe = document.createElement('iframe');
    iframe.setAttribute('title', 'Car Collection Route Planner');
    document.body.innerHTML = '';
    document.body.appendChild(iframe);
    var doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();
  } catch (e) {
    document.getElementById('boot').innerHTML = '<p>Could not load app.</p><p><a href="https://cdn.jsdelivr.net/gh/rogerpt/car-collection-route-planner-public@a39226b2c733d25ace36dc794c328760a82b962a/index.html">Open previous version</a></p><pre>' + e + '</pre>';
  }
})();
</script>
</body>
</html>
